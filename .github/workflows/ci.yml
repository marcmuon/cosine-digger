name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DIGGER_NO_SKIPS: "1"
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      # The installer tests run each supported shell.
      - run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev --extra browser --frozen
      # The Chrome playthrough (about 6 minutes) runs locally only: on the 3.13 runner one of its checks failed.
      # Log in from Chrome decrypts macOS Chrome's cookies with macOS CommonCrypto: its tests run on macOS only
      # (locally and in done_check), so this Linux run leaves them out rather than count them as skipped.
      - run: uv run pytest -q -rs --deselect tests/test_slice_playthrough.py --ignore=tests/test_chrome_login.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: false  # the smoke uses its own scratch cache, so there is nothing to save
      - run: sh scripts/smoke_wheel.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/smoke_docker.sh
