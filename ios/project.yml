# The Digger iPhone and iPad app. Generate Digger.xcodeproj with:
#   brew install xcodegen && cd ios && xcodegen
# The generated project is checked in too, so Xcode can open it without XcodeGen.
name: Digger
options:
  bundleIdPrefix: com.marcmuon
  xcodeVersion: "16.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  DiggerKit:
    path: DiggerKit
targets:
  Digger:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: Digger
      # Recorded server answers for the -DiggerDemo mode and SwiftUI previews.
      - path: DiggerKit/Tests/DiggerKitTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: DiggerKit
    info:
      path: Digger/Info.plist
      properties:
        CFBundleDisplayName: Digger
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The case color behind the first frame, so launch doesn't flash white.
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The skin is dark, like the web client's; system sheets and menus follow it.
        UIUserInterfaceStyle: Dark
        # The skin draws its own chrome (beveled keys, case-colored title strip), which iOS 26's
        # Liquid Glass bars and buttons would cover. This keeps the classic bars for it to style.
        UIDesignRequiresCompatibility: true
        # The web client's faces, from src/cosine_digger/web/static/vendor/fonts (SIL OFL 1.1).
        UIAppFonts:
          - PressStart2P-Regular.ttf
          - VT323-Regular.ttf
          - Silkscreen-Regular.ttf
          - Silkscreen-Bold.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # The phone stays upright; iPad turns, splits and resizes (the layout adapts).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Digger connects to the Digger running on your computer over your Wi-Fi.
        # Digger serves plain HTTP on your network: .local names and LAN addresses, and Tailscale names.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.marcmuon.cosinedigger.pair
            CFBundleURLSchemes:
              - cosinedigger
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Digger
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  DiggerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: DiggerUITests
    dependencies:
      - target: Digger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(inherited).uitests
        TEST_TARGET_NAME: Digger
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Digger:
    build:
      targets:
        Digger: all
        DiggerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - package: DiggerKit/DiggerKitTests
        - DiggerUITests
    profile:
      config: Release
    archive:
      config: Release
